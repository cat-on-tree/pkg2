# PKG24S4 local data configuration.

dataset:
  name: PKG24S4
  version: PKG24S4
  description: PubMed Knowledge Graph 2.0 update based on PubMed 2025 Baseline

paths:
  # Raw files downloaded from ScienceDB / PKG source.
  # Files are expected to be .tsv.gz, for example:
  # A01_Articles.tsv.gz, C23_BioEntities.tsv.gz
  raw_dir: data/raw/pkg24s4

  # Intermediate files generated by scripts.
  interim_dir: data/interim

  # Converted Parquet files.
  parquet_dir: data/interim/parquet

  # Schema summary generated by inspection script.
  schema_summary: data/interim/schema_summary.csv

  # Final graph-ready outputs.
  processed_dir: data/processed

file_patterns:
  raw_tsv_gz: "*.tsv.gz"
  raw_tsv: "*.tsv"

read_options:
  separator: "\t"
  has_header: true
  encoding: "utf8-lossy"

parquet:
  compression: "zstd"
  statistics: true

inspection:
  sample_rows: 20
  count_rows: false

debug:
  limit_rows: null

ids:
  preserve_as_string: true

notes:
  - "Raw data should be treated as immutable."
  - "Do not commit raw, interim, processed, parquet, duckdb, or cache files."
  - "For first-stage ETL, prefer Polars or DuckDB over pandas for large files."